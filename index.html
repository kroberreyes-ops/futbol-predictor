

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fútbol Predictor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f1f5f9;font-family:Arial,sans-serif;padding:18px}
header{text-align:center;padding:18px 0}
h1{color:#38d996;margin-bottom:6px}
p{color:#b8c4d6}
.card{background:#1c293b;padding:18px;border-radius:14px;margin:15px 0}
label{display:block;margin:14px 0 7px}
input,select,button{width:100%;padding:13px;border-radius:8px;border:1px solid #40516a;font-size:16px}
input,select{background:#101827;color:white}
button{background:#16a36a;color:white;font-weight:bold;border:0;margin-top:14px}
.result{background:#101827;padding:13px;border-radius:8px;margin-top:10px}
small{color:#aab8ca}
</style>
</head>
<body>
<header>
<h1>⚽ Fútbol Predictor</h1>
<p>Análisis estadístico de partidos</p>
</header>

<section class="card">
<h3>1. Partidos disponibles</h3>
<label for="fecha">Fecha del partido</label>
<input type="date" id="fecha">
<button onclick="cargarPartidos()">Consultar partidos</button>
<p id="estado">Conectando con el servidor...</p>
<label for="local">Equipo local</label>
<select id="local">
<option value="">Selecciona el equipo local</option>
</select>
<label for="visitante">Equipo visitante</label>
<select id="visitante">
<option value="">Selecciona el equipo visitante</option>
</select>
<button onclick="analizar()">Analizar partido</button>
</section>

<section class="card">
<h3>2. Predicción estadística</h3>
<div id="resultado" class="result">
Selecciona dos equipos para comenzar.
</div>
</section>

<section class="card">
<h3>3. Datos del servidor</h3>
<div id="partidos"><small>Los partidos aparecerán aquí.</small></div>
</section>

<script>
const API="https://futbol-predictor-api.kroberreyes.workers.dev";
let partidos=[];

const fecha=document.getElementById("fecha");
const hoy=new Date();
fecha.value=[
hoy.getFullYear(),
String(hoy.getMonth()+1).padStart(2,"0"),
String(hoy.getDate()).padStart(2,"0")
].join("-");

async function cargarPartidos(){
const estado=document.getElementById("estado");
const lista=document.getElementById("partidos");
estado.textContent="Consultando partidos...";
lista.textContent="Cargando...";
try{
const url=API+"/fixtures?date="+encodeURIComponent(fecha.value);
const respuesta=await fetch(url);
if(!respuesta.ok)throw Error("Error HTTP "+respuesta.status);
const datos=await respuesta.json();
if(datos.errors && Object.keys(datos.errors).length){
throw Error(JSON.stringify(datos.errors));
}
if(!Array.isArray(datos.response)){
throw Error("El servidor no devolvió la lista de partidos esperada.");
}
partidos=datos.response;
llenarEquipos();
estado.textContent="Partidos recibidos: "+partidos.length;
lista.innerHTML="";
if(!partidos.length){
lista.textContent="No hay partidos para esta fecha.";
return;
}
partidos.forEach(p=>{
const f=p.fixture||{};
const l=p.teams?.home?.name||"Local";
const v=p.teams?.away?.name||"Visitante";
const goles=p.goals||{};
const marcador=(goles.home??"-")+" - "+(goles.away??"-");
const div=document.createElement("div");
div.className="result";
const titulo=document.createElement("strong");
titulo.textContent=l+" vs "+v;
const detalle=document.createElement("p");
detalle.textContent=(p.league?.name||"Liga")+" · "+(f.status?.long||"Estado desconocido")+" · "+marcador;
div.append(titulo,detalle);
lista.appendChild(div);
});
}catch(e){
estado.textContent="No se pudieron cargar los partidos.";
lista.textContent=e.message;
}
}

function llenarEquipos(){
const local=document.getElementById("local");
const visitante=document.getElementById("visitante");
local.replaceChildren(new Option("Selecciona el equipo local",""));
visitante.replaceChildren(new Option("Selecciona el equipo visitante",""));
const equipos=new Map();
partidos.forEach(p=>{
if(p.teams?.home) equipos.set(String(p.teams.home.id),p.teams.home.name);
if(p.teams?.away) equipos.set(String(p.teams.away.id),p.teams.away.name);
});
equipos.forEach((nombre,id)=>{
local.add(new Option(nombre,id));
visitante.add(new Option(nombre,id));
});
}

function analizar(){
const idL=document.getElementById("local").value;
const idV=document.getElementById("visitante").value;
const salida=document.getElementById("resultado");
if(!idL||!idV||idL===idV){
salida.textContent="Selecciona dos equipos diferentes.";
return;
}
const partido=partidos.find(p=>
String(p.teams?.home?.id)===idL &&
String(p.teams?.away?.id)===idV
);
if(!partido){
salida.textContent="No se encontró este enfrentamiento en la fecha seleccionada. Consulta otra fecha o selecciona los equipos en el orden del partido.";
return;
}
const f=partido.fixture||{};
const goles=partido.goals||{};
salida.replaceChildren();
const titulo=document.createElement("strong");
titulo.textContent=partido.teams.home.name+" vs "+partido.teams.away.name;
const detalle=document.createElement("p");
detalle.textContent="Liga: "+(partido.league?.name||"No disponible")+
" · Estado: "+(f.status?.long||"No disponible");
const marcador=document.createElement("p");
marcador.textContent="Marcador registrado: "+
(goles.home??"Sin dato")+" - "+(goles.away??"Sin dato");
const aviso=document.createElement("small");
aviso.textContent="Esta versión consulta el calendario y el marcador disponible. Todavía no calcula probabilidades reales a partir de los últimos partidos, córners, tarjetas, fueras de juego o remates. No se inventan estadísticas.";
salida.append(titulo,detalle,marcador,aviso);
}

cargarPartidos();
</script>
</body>
</html>
