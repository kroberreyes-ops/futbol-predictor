
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fútbol Predictor</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#101827;color:#f4f7fb}
main{max-width:650px;margin:auto}
h1{color:#65e6a3;font-size:27px}
.card{background:#1c293b;padding:16px;border-radius:14px;margin:14px 0}
label{display:block;margin:13px 0 6px}
input,button{width:100%;padding:13px;border-radius:9px;font-size:16px}
input{background:#fff;color:#111;border:1px solid #bbb}
button{border:0;background:#21bd78;color:#071a12;font-weight:bold;margin-top:13px}
button:disabled{opacity:.5}
.small{color:#bac7d8;font-size:13px}
#status,#result{white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>⚽ Fútbol Predictor</h1>
<p>Estadísticas para analizar partidos de fútbol.</p>

<section class="card">
<h2>Buscar partido</h2>
<label for="date">Fecha del partido</label>
<input id="date" type="date">

<button id="load">Cargar equipos de esta fecha</button>
<p id="status">Preparando aplicación...</p>

<label for="home">Equipo local</label>
<input id="home" list="teams" placeholder="Escribe para buscar el equipo" autocomplete="off">

<label for="away">Equipo visitante</label>
<input id="away" list="teams" placeholder="Escribe para buscar el equipo" autocomplete="off">

<datalist id="teams"></datalist>

<button id="analyze">Analizar últimos 5 partidos</button>
</section>

<section class="card">
<h2>Resultado del análisis</h2>
<div id="result">Selecciona los equipos y pulsa Analizar.</div>
</section>

<section class="card">
<h3>Conexión</h3>
<p id="connection">Conectando con el servidor...</p>
<p class="small">Las predicciones son estimaciones estadísticas, no resultados garantizados.</p>
</section>
</main>

<script>
const API = "https://futbol-predictor-api.kroberreyes.workers.dev";

const $ = id => document.getElementById(id);
const dateInput = $("date");
const homeInput = $("home");
const awayInput = $("away");
const datalist = $("teams");

let fixtures = [];
let teamsByName = new Map();
let busy = false;

function localDate(){
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

dateInput.value = localDate();

async function apiGet(path, params){
  const url = new URL(API + path);
  Object.entries(params).forEach(([k,v]) =>
    url.searchParams.set(k,v)
  );

  const response = await fetch(url);
  const data = await response.json();

  if (!response.ok || data.rateLimit || data.errors &&
      Object.keys(data.errors).length) {
    throw new Error(
      data.rateLimit ||
      JSON.stringify(data.errors || data)
    );
  }

  return data;
}

function addTeam(name,id){
  if(!name || !id) return;
  if(!teamsByName.has(name)) teamsByName.set(name,id);
}

async function loadFixtures(){
  if(busy) return;
  busy = true;
  $("load").disabled = true;
  $("status").textContent = "Cargando equipos...";
  $("connection").textContent = "Consultando servidor...";
  $("result").textContent = "Esperando datos...";
  fixtures = [];
  teamsByName.clear();
  datalist.replaceChildren();

  try{
    const data = await apiGet("/fixtures", {date:dateInput.value});
    fixtures = data.response || [];

    if(!fixtures.length){
      $("status").textContent =
        "No se encontraron partidos para esta fecha.";
      $("connection").textContent = "Conexión realizada.";
      return;
    }

    fixtures.forEach(f=>{
      addTeam(f.teams?.home?.name,f.teams?.home?.id);
      addTeam(f.teams?.away?.name,f.teams?.away?.id);
    });

    [...teamsByName.keys()].sort((a,b)=>a.localeCompare(b))
      .forEach(name=>{
        const option = document.createElement("option");
        option.value = name;
        datalist.appendChild(option);
      });

    $("status").textContent =
      "Partidos recibidos: " + fixtures.length +
      "\nEquipos disponibles: " + teamsByName.size +
      "\nEscribe parte del nombre para encontrar un equipo.";

    $("connection").textContent = "Conexión correcta.";
    $("result").textContent =
      "Ahora elige el equipo local y el visitante.";
  }catch(e){
    $("status").textContent = "Error al cargar equipos:\n" + e.message;
    $("connection").textContent = "No se pudo consultar la API.";
  }finally{
    busy = false;
    $("load").disabled = false;
  }
}

function findTeamId(name){
  const wanted = name.trim().toLocaleLowerCase();
  for(const [team,id] of teamsByName){
    if(team.toLocaleLowerCase() === wanted) return id;
  }
  return null;
}

function getCache(key){
  try{
    const saved = sessionStorage.getItem(key);
    if(!saved) return null;
    const item = JSON.parse(saved);
    if(Date.now()-item.time > 10*60*1000) return null;
    return item.data;
  }catch(e){ return null; }
}

function saveCache(key,data){
  try{
    sessionStorage.setItem(key,JSON.stringify({
      time:Date.now(),data
    }));
  }catch(e){}
}

async function getLastFive(teamId){
  const key = "last5-" + teamId;
  const cached = getCache(key);
  if(cached) return cached;

  const data = await apiGet("/fixtures",{
    team:teamId,
    last:5
  });

  const games = data.response || [];
  saveCache(key,games);
  return games;
}

function summarize(name,games,teamId){
  let wins=0,draws=0,losses=0,gf=0,ga=0;
  let over15=0,btts=0,played=0;

  games.forEach(g=>{
    const homeId=g.teams?.home?.id;
    const isHome=homeId===teamId;
    const h=g.goals?.home;
    const a=g.goals?.away;
    if(h===null || a===null || h===undefined || a===undefined) return;

    const scored=Number(isHome?h:a);
    const conceded=Number(isHome?a:h);
    played++;
    gf+=scored;
    ga+=conceded;

    if(scored>conceded) wins++;
    else if(scored===conceded) draws++;
    else losses++;

    if(scored+conceded>1) over15++;
    if(scored>0 && conceded>0) btts++;
  });

  return {
    name,played,wins,draws,losses,gf,ga,over15,btts
  };
}

function showStats(s){
  if(!s.played) return s.name + ": no hay resultados completos disponibles.\n";
  return `${s.name}
Partidos analizados: ${s.played}
Victorias: ${s.wins}
Empates: ${s.draws}
Derrotas: ${s.losses}
Goles a favor: ${s.gf}
Goles en contra: ${s.ga}
Más de 1.5 goles en el partido: ${s.over15}/${s.played}
Ambos equipos anotaron: ${s.btts}/${s.played}

`;
}

async function analyze(){
  if(busy) return;

  const homeName=homeInput.value.trim();
  const awayName=awayInput.value.trim();
  const homeId=findTeamId(homeName);
  const awayId=findTeamId(awayName);

  if(!homeId || !awayId){
    $("result").textContent =
      "Selecciona los dos equipos de las sugerencias que aparecen al escribir.";
    return;
  }
  if(String(homeId)===String(awayId)){
    $("result").textContent = "Elige dos equipos diferentes.";
    return;
  }

  busy=true;
  $("analyze").disabled=true;
  $("result").textContent =
    "Analizando los últimos 5 partidos. Espera a que termine...";

  try{
    // Consultas secuenciales para evitar solicitudes simultáneas.
    const homeGames=await getLastFive(homeId);
    const awayGames=await getLastFive(awayId);

    const h=summarize(homeName,homeGames,homeId);
    const a=summarize(awayName,awayGames,awayId);

    let prediction="Los datos no son suficientes para inclinarse por un equipo.";
    if(h.played && a.played){
      const homeScore=(h.wins*3+h.draws)+(h.gf-h.ga)*0.3;
      const awayScore=(a.wins*3+a.draws)+(a.gf-a.ga)*0.3;

      if(homeScore>awayScore+1) prediction =
        "Tendencia estadística: ventaja para el equipo local.";
      else if(awayScore>homeScore+1) prediction =
        "Tendencia estadística: ventaja para el equipo visitante.";
      else prediction =
        "Tendencia estadística: partido equilibrado.";
    }

    $("result").textContent =
      "ANÁLISIS DE LOS ÚLTIMOS PARTIDOS\n\n"+
      showStats(h)+showStats(a)+
      "LECTURA ESTADÍSTICA\n"+prediction+
      "\n\nImportante: esto no garantiza el resultado. "+
      "Todavía no incluye córners, tarjetas, fueras de juego "+
      "ni remates de jugadores.";
  }catch(e){
    $("result").textContent =
      "No se pudo completar el análisis:\n"+e.message+
      "\n\nSi aparece el límite de solicitudes, espera un poco "+
      "antes de volver a intentarlo.";
  }finally{
    busy=false;
    $("analyze").disabled=false;
  }
}

$("load").addEventListener("click",loadFixtures);
$("analyze").addEventListener("click",analyze);
loadFixtures();
</script>
</body>
</html>
